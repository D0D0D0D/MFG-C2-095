# Species profile — マガキ (Crassostrea gigas / Pacific oyster), 二枚貝
#
# docs/02_design.md §(a): metric / category / agent / inputs.type are dictionary
# references resolved by this file — NOT hardcoded enums in code. Adding a new
# species = adding a new profile file, no code change.
#
# ── Alarm limits ─────────────────────────────────────────────────────────────
# Each metric declares up to four OPTIONAL scalar thresholds, following the
# OPC UA LimitAlarmType convention (OPC 10000-9 §5.8.11):
#
#     low_low_limit <= low_limit <= high_limit <= high_high_limit
#
#     value <  low_low_limit   or  value >  high_high_limit  -> critical
#     value <  low_limit       or  value >  high_limit       -> medium
#     otherwise                                              -> no signal
#
# Omit a side to declare "no danger zone there": turbidity has only high_*,
# dissolved_oxygen only low_*, water_temp all four. `normal_range` is kept for
# display/explanation only and is NOT used to score observations.
#
# ── Provenance (READ THIS BEFORE USING IN PRODUCTION) ────────────────────────
# The numeric limits below are UNVERIFIED placeholder values, generated to
# exercise the implementation. They have NOT been checked against fisheries
# research literature and MUST NOT be relied on for operational decisions.
#
# docs/02_design.md §(a): the initial species set is an implementation-verification
# example; the real set is fixed to the PoC customer's farmed species. Before a
# PoC, replace these with values sourced from the customer's own records or from
# cited literature, and record the source in `limits_source` below.

species_code: "magaki"
species_name_ja: "マガキ"
species_name_en: "Pacific oyster"
taxon_group: "bivalve"
limits_source: "UNVERIFIED — placeholder values for implementation verification (see header)"

metrics:
  water_temp:
    unit: "celsius"
    normal_range: [5.0, 27.0]
    high_limit: 27.0
    high_high_limit: 30.0
    notes: "高水温期(28度超)の斃死リスク上昇に注意"
  salinity:
    unit: "psu"
    normal_range: [18.0, 32.0]
    low_low_limit: 8.0
    low_limit: 18.0
    notes: "大雨後の低塩分は垂下連の斃死要因になりうる"
  dissolved_oxygen:
    unit: "mg/L"
    normal_range: [5.0, 11.0]
    low_low_limit: 3.0
    low_limit: 5.0
  chlorophyll_a:
    unit: "ug/L"
    normal_range: [1.0, 20.0]
    high_limit: 20.0
    high_high_limit: 50.0
    notes: "赤潮プランクトン増殖の代理指標"
  turbidity:
    unit: "ntu"
    normal_range: [0.0, 20.0]
    high_limit: 20.0
    high_high_limit: 50.0

disease_triggers:
  - category: "disease"
    agent: "ostreid_herpesvirus"
    agent_ja: "カキヘルペスウイルス様斃死"
    environmental_signals: ["water_temp rising rapidly in spring", "juvenile_stage"]
    severity_baseline: "high"
  - category: "red_tide"
    agent: "harmful_algal_bloom"
    agent_ja: "赤潮（麻痺性貝毒原因種含む）"
    environmental_signals: ["chlorophyll_a_rising", "water_temp>20", "calm_weather_sustained"]
    severity_baseline: "critical"
  - category: "hypoxia"
    agent: "dissolved_oxygen_depletion"
    agent_ja: "貧酸素水塊による垂下連斃死"
    environmental_signals: ["dissolved_oxygen<3.0 sustained"]
    severity_baseline: "critical"
  - category: "heat"
    agent: "summer_mass_mortality"
    agent_ja: "夏季高水温による大量斃死"
    environmental_signals: ["water_temp>28 sustained"]
    severity_baseline: "critical"
  - category: "typhoon"
    agent: "raft_line_damage"
    agent_ja: "台風による筏・垂下連の損壊・流失"
    environmental_signals: ["jma_typhoon_warning"]
    severity_baseline: "critical"

input_types:
  - type: "seeding"
    label_ja: "種苗（種ガキ）投入"
  - type: "thinning"
    label_ja: "間引き"
  - type: "net_cleaning"
    label_ja: "垂下連・網の付着物除去"
  - type: "harvest"
    label_ja: "収穫"

regional_source_refs: []
