# Optional per-farm regional data source registry — design-time extension point ONLY.
#
# docs/02_design.md §(d): 赤潮ネット・貧酸素水塊予測は都道府県/地域ごとに個別システムが
# 分立しており統一APIが存在しない。v1 では自動取得を実装せず、farm_id ごとに手動で
# 参照URLを記録できる拡張点としてスキーマのみ用意する（species_profile.regional_source_refs
